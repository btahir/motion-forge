<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" data-category="illustrations">
  <title>Rocket launch</title>
  <desc>Onboarding rocket idling on its pad with a flickering flame; click or send launch to crouch, ignite and blast off out of frame, then click again or send reset to land it gently.</desc>
  <defs>
    <clipPath id="hull">
      <path d="M120 58 C139 72 144 98 144 124 V168 Q144 176 136 176 H104 Q96 176 96 168 V124 C96 98 101 72 120 58Z"/>
    </clipPath>
  </defs>
  <g id="stage">
    <circle id="backdrop" cx="120" cy="116" r="94" fill="#efeae0"/>
    <g id="stars" fill="#ffb020">
      <circle class="star" cx="62" cy="72" r="3"/>
      <circle class="star" cx="178" cy="60" r="2.5"/>
      <circle class="star" cx="170" cy="120" r="2"/>
      <circle class="star" cx="72" cy="134" r="2"/>
      <circle class="star" cx="92" cy="40" r="2"/>
    </g>
    <ellipse id="shadow" cx="120" cy="204" rx="54" ry="6" fill="#d8d2c6"/>
    <g id="rocket">
      <g id="rocket-body">
        <g id="flame-size">
          <g id="flame">
            <path d="M107 174 C107 185 114 191 120 200 C126 191 133 185 133 174Z" fill="#ffb020"/>
            <path d="M113 174 C113 182 116 186 120 192 C124 186 127 182 127 174Z" fill="#ff5a1f"/>
          </g>
        </g>
        <path d="M100 138 L82 164 Q78 172 86 174 L100 172Z" fill="#ff5a1f"/>
        <path d="M140 138 L158 164 Q162 172 154 174 L140 172Z" fill="#ff5a1f"/>
        <g clip-path="url(#hull)">
          <rect x="94" y="56" width="52" height="124" fill="#fbf8f1"/>
          <path d="M128 56 C134 80 136 100 136 124 V180 H146 V56Z" fill="#d8d2c6" opacity="0.7"/>
          <rect x="94" y="56" width="52" height="30" fill="#ff5a1f"/>
        </g>
        <circle cx="120" cy="114" r="14" fill="#1b1a17"/>
        <circle cx="120" cy="114" r="9.5" fill="#4c8dff"/>
        <circle cx="116.5" cy="110.5" r="3" fill="#fbf8f1" opacity="0.8"/>
        <rect x="115" y="146" width="10" height="32" rx="5" fill="#ff5a1f"/>
        <rect x="118.5" y="150" width="3" height="22" rx="1.5" fill="#fbf8f1" opacity="0.45"/>
      </g>
    </g>
    <g id="pad">
      <rect x="92" y="186" width="8" height="16" rx="2" fill="#1b1a17"/>
      <rect x="140" y="186" width="8" height="16" rx="2" fill="#1b1a17"/>
      <rect x="80" y="180" width="33" height="9" rx="4.5" fill="#1b1a17"/>
      <rect x="127" y="180" width="33" height="9" rx="4.5" fill="#1b1a17"/>
    </g>
    <g id="smoke" fill="#d8d2c6">
      <circle class="puff-l" cx="100" cy="186" r="11" opacity="0"/>
      <circle class="puff-l" cx="90" cy="192" r="9" opacity="0"/>
      <circle class="puff-l" cx="104" cy="194" r="8" opacity="0"/>
      <circle class="puff-r" cx="140" cy="186" r="11" opacity="0"/>
      <circle class="puff-r" cx="150" cy="192" r="9" opacity="0"/>
      <circle class="puff-r" cx="136" cy="194" r="8" opacity="0"/>
    </g>
  </g>
  <metadata type="application/motion+json"><![CDATA[
  {
    "initial": "idle",
    "on": { "launch": "launch", "reset": "landing" },
    "states": {
      "idle": {
        "animate": {},
        "on": { "tap": "launch", "reset": "idle" }
      },
      "launch": { "allowOverflow": true,
        "duration": 1700,
        "animate": {
          "#rocket": {
            "translateY": { "0": 0, "300ms": 3, "650ms": 2, "1600ms": { "value": -330, "ease": "cubic-bezier(0.55, 0, 0.9, 0.6)" } },
            "translateX": { "0": 0, "320ms": 0, "380ms": 1.2, "440ms": -1.2, "500ms": 1, "560ms": -1, "620ms": 0.6, "680ms": 0 },
            "scaleY": { "0": 1, "300ms": { "value": 0.9, "ease": "in-out" }, "620ms": 0.92, "760ms": { "value": 1.1, "ease": "out" }, "1100ms": 1.04 },
            "scaleX": { "0": 1, "300ms": { "value": 1.06, "ease": "in-out" }, "620ms": 1.05, "760ms": { "value": 0.94, "ease": "out" }, "1100ms": 0.98 },
            "origin": "120 180"
          },
          "#flame-size": {
            "scaleY": { "0": 1, "200ms": 0.6, "380ms": { "value": 2.1, "ease": "back" }, "700ms": 2.35, "1100ms": 3.2 },
            "scaleX": { "0": 1, "200ms": 0.8, "380ms": { "value": 1.25, "ease": "back" }, "700ms": 1.2 },
            "origin": "120 174"
          },
          ".puff-l": {
            "translateX": { "0": 0, "350ms": 0, "1300ms": { "value": -34, "ease": "out" } },
            "translateY": { "0": 0, "350ms": 0, "1300ms": { "value": -6, "ease": "out" } },
            "scale": { "0": 0.2, "350ms": 0.2, "650ms": { "value": 1.2, "ease": "out" }, "1500ms": 1.5 },
            "opacity": { "0": 0, "350ms": 0, "480ms": 1, "1000ms": 1, "1600ms": 0 },
            "stagger": 60
          },
          ".puff-r": {
            "translateX": { "0": 0, "380ms": 0, "1330ms": { "value": 34, "ease": "out" } },
            "translateY": { "0": 0, "380ms": 0, "1330ms": { "value": -6, "ease": "out" } },
            "scale": { "0": 0.2, "380ms": 0.2, "680ms": { "value": 1.2, "ease": "out" }, "1530ms": 1.5 },
            "opacity": { "0": 0, "380ms": 0, "510ms": 1, "1030ms": 1, "1630ms": 0 },
            "stagger": 60
          },
          "#shadow": { "scale": { "0": 1, "650ms": 1, "1300ms": { "value": 0.3, "ease": "in" } }, "opacity": { "0": 1, "650ms": 1, "1300ms": 0 } }
        },
        "next": { "to": "launched", "blend": 0 }
      },
      "launched": { "allowOverflow": true,
        "animate": {
          "#rocket": { "translateY": -330 },
          "#shadow": { "scale": 0.3, "opacity": 0 }
        },
        "on": { "tap": "landing" }
      },
      "landing": { "allowOverflow": true,
        "duration": 1900,
        "animate": {
          "#rocket": {
            "translateY": { "0": -250, "1400ms": { "value": 0, "ease": "cubic-bezier(0.2, 0.7, 0.35, 1)" } },
            "scaleY": { "0": 1.05, "1100ms": 1, "1400ms": 1, "1500ms": { "value": 0.9, "ease": "out" }, "1700ms": { "value": 1.02, "ease": "in-out" }, "1900ms": 1 },
            "scaleX": { "0": 0.97, "1100ms": 1, "1400ms": 1, "1500ms": { "value": 1.06, "ease": "out" }, "1700ms": { "value": 0.99, "ease": "in-out" }, "1900ms": 1 },
            "origin": "120 180"
          },
          "#flame-size": {
            "scaleY": { "0": 2.4, "1000ms": 2.1, "1400ms": 1.3, "1600ms": { "value": 1, "ease": "out" } },
            "origin": "120 174"
          },
          ".puff-l": {
            "translateX": { "0": 0, "1350ms": 0, "1900ms": { "value": -18, "ease": "out" } },
            "scale": { "0": 0.3, "1350ms": 0.3, "1900ms": { "value": 0.8, "ease": "out" } },
            "opacity": { "0": 0, "1350ms": 0, "1450ms": 0.9, "1900ms": 0 },
            "stagger": 40
          },
          ".puff-r": {
            "translateX": { "0": 0, "1350ms": 0, "1900ms": { "value": 18, "ease": "out" } },
            "scale": { "0": 0.3, "1350ms": 0.3, "1900ms": { "value": 0.8, "ease": "out" } },
            "opacity": { "0": 0, "1350ms": 0, "1450ms": 0.9, "1900ms": 0 },
            "stagger": 40
          },
          "#shadow": { "scale": { "0": 0.3, "1400ms": { "value": 1, "ease": "out" } }, "opacity": { "0": 0, "1400ms": { "value": 1, "ease": "out" } } }
        },
        "next": "idle"
      }
    },
    "interactions": [
      { "on": "click", "target": "#stage", "send": "tap" }
    ],
    "layers": {
      "flicker": {
        "states": {
          "burn": {
            "duration": 480,
            "loop": true,
            "ease": "in-out",
            "animate": {
              "#flame": {
                "scaleY": { "0%": 1, "25%": 1.14, "50%": 0.94, "75%": 1.1, "100%": 1 },
                "scaleX": { "0%": 1, "25%": 0.92, "50%": 1.05, "75%": 0.95, "100%": 1 },
                "origin": "120 174"
              }
            }
          }
        }
      },
      "twinkle": {
        "states": {
          "on": {
            "duration": 3000,
            "loop": true,
            "animate": {
              ".star": { "opacity": { "0%": 1, "20%": 0.25, "40%": 1, "100%": 1 }, "stagger": 600 }
            }
          }
        }
      }
    }
  }
  ]]></metadata>
</svg>
