<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" data-category="controls">
  <title>Toggle</title>
  <desc>Pill switch whose knob stretches as it slides and turns its dash into a check. Input: on (boolean), click toggles it. Emits "on" and "off".</desc>
  <g id="switch">
    <rect id="track" x="24" y="28" width="152" height="64" rx="32" fill="#d8d2c6"/>
    <g id="knob">
      <g id="knob-body">
        <ellipse id="knob-shadow" cx="56" cy="64" rx="25" ry="24" fill="#1b1a17" opacity="0.14"/>
        <circle id="knob-face" cx="56" cy="60" r="25" fill="#fbf8f1"/>
        <path id="icon" d="M47 60 L56 60 L65 60" fill="none" stroke="#d8d2c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <metadata type="application/motion+json"><![CDATA[
  {
    "inputs": { "on": false },
    "states": {
      "off": {
        "when": { "on": "turning-on" }
      },
      "turning-on": {
        "duration": 380,
        "emit": "on",
        "animate": {
          "#knob": {
            "translateX": { "0%": 0, "14%": { "value": -3, "ease": "in-out" }, "62%": { "value": 92, "ease": "in-out" }, "100%": { "value": 88, "ease": "spring" } }
          },
          "#knob-body": {
            "scaleX": { "0%": 1, "14%": 0.9, "38%": { "value": 1.3, "ease": "out" }, "68%": { "value": 0.9, "ease": "in-out" }, "100%": { "value": 1, "ease": "spring" } },
            "scaleY": { "0%": 1, "14%": 1.06, "38%": { "value": 0.84, "ease": "out" }, "68%": { "value": 1.06, "ease": "in-out" }, "100%": { "value": 1, "ease": "spring" } },
            "origin": "56 60"
          },
          "#track": {
            "fill": { "0%": "#d8d2c6", "20%": "#d8d2c6", "70%": { "value": "#2fbf8f", "ease": "in-out" } }
          },
          "#icon": {
            "d": { "0%": "M47 60 L56 60 L65 60", "35%": "M47 60 L56 60 L65 60", "85%": { "value": "M46 61 L53 68 L66 53", "ease": "back" } },
            "stroke": { "0%": "#d8d2c6", "35%": "#d8d2c6", "75%": "#2fbf8f" }
          }
        },
        "next": "on",
        "when": { "!on": "turning-off" }
      },
      "on": {
        "animate": {
          "#knob": { "translateX": 88 },
          "#track": { "fill": "#2fbf8f" },
          "#icon": { "d": "M46 61 L53 68 L66 53", "stroke": "#2fbf8f" }
        },
        "when": { "!on": "turning-off" }
      },
      "turning-off": {
        "duration": 340,
        "emit": "off",
        "animate": {
          "#knob": {
            "translateX": { "0%": 88, "14%": { "value": 91, "ease": "in-out" }, "62%": { "value": -4, "ease": "in-out" }, "100%": { "value": 0, "ease": "spring" } }
          },
          "#knob-body": {
            "scaleX": { "0%": 1, "14%": 0.9, "38%": { "value": 1.26, "ease": "out" }, "68%": { "value": 0.92, "ease": "in-out" }, "100%": { "value": 1, "ease": "spring" } },
            "scaleY": { "0%": 1, "14%": 1.06, "38%": { "value": 0.86, "ease": "out" }, "68%": { "value": 1.05, "ease": "in-out" }, "100%": { "value": 1, "ease": "spring" } },
            "origin": "56 60"
          },
          "#track": {
            "fill": { "0%": "#2fbf8f", "15%": "#2fbf8f", "65%": { "value": "#d8d2c6", "ease": "in-out" } }
          },
          "#icon": {
            "d": { "0%": "M46 61 L53 68 L66 53", "15%": "M46 61 L53 68 L66 53", "60%": { "value": "M47 60 L56 60 L65 60", "ease": "out" } },
            "stroke": { "0%": "#2fbf8f", "15%": "#2fbf8f", "55%": "#d8d2c6" }
          }
        },
        "next": "off",
        "when": { "on": "turning-on" }
      }
    },
    "interactions": [
      { "on": "click", "target": "#switch", "toggle": "on" }
    ]
  }
  ]]></metadata>
</svg>
