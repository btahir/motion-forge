<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" data-category="data">
  <title>Gauge</title>
  <desc>Semicircular gauge: input value 0-100 (smoothed) drives the needle, arc fill and readout; drag across it to set the value, send settle for a needle wobble.</desc>
  <path id="track" d="M 28 114 A 72 72 0 0 1 172 114" fill="none" stroke="#efeae0" stroke-width="14" stroke-linecap="round"/>
  <path id="fill" d="M 28 114 A 72 72 0 0 1 172 114" fill="none" stroke="#2fbf8f" stroke-width="14" stroke-linecap="round"/>
  <g id="ticks" stroke="#d8d2c6" stroke-width="1.5" stroke-linecap="round">
    <line x1="55" y1="114" x2="43" y2="114" stroke="#1b1a17" stroke-width="2"/>
    <line x1="49.63" y1="106.02" x2="43.7" y2="105.08"/>
    <line x1="51.5" y1="98.24" x2="45.79" y2="96.39"/>
    <line x1="54.56" y1="90.85" x2="49.21" y2="88.12"/>
    <line x1="58.74" y1="84.02" x2="53.89" y2="80.5"/>
    <line x1="68.18" y1="82.18" x2="59.69" y2="73.69" stroke="#1b1a17" stroke-width="2"/>
    <line x1="70.02" y1="72.74" x2="66.5" y2="67.89"/>
    <line x1="76.85" y1="68.56" x2="74.12" y2="63.21"/>
    <line x1="84.24" y1="65.5" x2="82.39" y2="59.79"/>
    <line x1="92.02" y1="63.63" x2="91.08" y2="57.7"/>
    <line x1="100" y1="69" x2="100" y2="57" stroke="#1b1a17" stroke-width="2"/>
    <line x1="107.98" y1="63.63" x2="108.92" y2="57.7"/>
    <line x1="115.76" y1="65.5" x2="117.61" y2="59.79"/>
    <line x1="123.15" y1="68.56" x2="125.88" y2="63.21"/>
    <line x1="129.98" y1="72.74" x2="133.5" y2="67.89"/>
    <line x1="131.82" y1="82.18" x2="140.31" y2="73.69" stroke="#1b1a17" stroke-width="2"/>
    <line x1="141.26" y1="84.02" x2="146.11" y2="80.5"/>
    <line x1="145.44" y1="90.85" x2="150.79" y2="88.12"/>
    <line x1="148.5" y1="98.24" x2="154.21" y2="96.39"/>
    <line x1="150.37" y1="106.02" x2="156.3" y2="105.08"/>
    <line x1="145" y1="114" x2="157" y2="114" stroke="#1b1a17" stroke-width="2"/>
  </g>
  <g fill="#1b1a17" fill-opacity="0.45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="500" text-anchor="middle">
    <text x="28" y="134">0</text>
    <text x="172" y="134">100</text>
  </g>
  <g id="needle">
    <path id="needle-body" d="M 96.6 114 L 99.2 62 Q 100 58.5 100.8 62 L 103.4 114 Z" fill="#1b1a17"/>
  </g>
  <circle id="hub" cx="100" cy="114" r="8" fill="#1b1a17"/>
  <circle id="hub-dot" cx="100" cy="114" r="3" fill="#2fbf8f"/>
  <text id="readout" x="100" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1b1a17" letter-spacing="-0.5">40%</text>
  <rect id="hit" x="14" y="30" width="172" height="140" fill="#fbf8f1" fill-opacity="0"/>
  <metadata type="application/motion+json"><![CDATA[
  {
    "inputs": {
      "value": { "type": "number", "min": 0, "max": 100, "default": 40, "smooth": 450 }
    },
    "states": {
      "idle": { "on": { "settle": "settle" } },
      "settle": {
        "duration": 700,
        "animate": {
          "#needle-body": { "rotate": { "0%": 0, "20%": 3.5, "42%": -2, "62%": 0.9, "80%": -0.3, "100%": 0 }, "ease": "in-out", "origin": "100 114" }
        },
        "on": { "settle": "settle" },
        "next": "idle"
      }
    },
    "bind": {
      "#needle":   { "rotate": { "input": "value", "from": -90, "to": 90 }, "origin": "100 114" },
      "#fill":     { "draw":   { "input": "value", "from": 0, "to": 1 },
                     "stroke": { "input": "value", "map": { "0": "#2fbf8f", "50": "#2fbf8f", "58": "#ffb020", "72": "#ffb020", "82": "#ff4d6d", "100": "#ff4d6d" } } },
      "#hub-dot":  { "fill":   { "input": "value", "map": { "0": "#2fbf8f", "50": "#2fbf8f", "58": "#ffb020", "72": "#ffb020", "82": "#ff4d6d", "100": "#ff4d6d" } } },
      "#readout":  { "text": "{value}%" }
    },
    "interactions": [
      { "on": "drag", "target": "#hit", "x": "value", "leave": "settle" }
    ]
  }
  ]]></metadata>
</svg>
