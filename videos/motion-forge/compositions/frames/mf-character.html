    <script>
      (() => {
        const s = name => '[id="mf-character-' + name + '"]';
        const tl = gsap.timeline({ paused:true });
        tl.fromTo(s('brand'), {opacity:0, y:10}, {opacity:1, y:0, duration:.6, ease:'power3.out'}, 0);
        tl.fromTo(s('title'), {opacity:0, y:20}, {opacity:1, y:0, duration:.8, ease:'power3.out'}, .1);

        tl.set(s('idle'), {opacity:1}, 0);
        tl.set(s('pulse'), {opacity:0}, 0);
        [4,8].forEach(time => {
          tl.set(s('idle'), {opacity:0}, time);
